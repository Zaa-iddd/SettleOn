# Every push to main builds the game and deploys it to the Cloudflare Worker "settleon".
# Needs (repo Settings → Secrets and variables → Actions):
#   secret   CLOUDFLARE_API_TOKEN    a Cloudflare API token ("Edit Cloudflare Workers" template)
#   variable CLOUDFLARE_ACCOUNT_ID   the Cloudflare account id
#   variable VITE_DISCORD_CLIENT_ID  the Discord application id (public, baked into the build)
# DISCORD_CLIENT_SECRET stays a Worker secret on Cloudflare; deploys keep it.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button for a manual redeploy

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false # never cut a deploy off halfway; the next one queues

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VITE_DISCORD_CLIENT_ID: ${{ vars.VITE_DISCORD_CLIENT_ID }}
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VITE_DISCORD_CLIENT_ID; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set in the repo's Actions secrets/variables"; missing=1; fi
          done
          exit $missing

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_DISCORD_CLIENT_ID: ${{ vars.VITE_DISCORD_CLIENT_ID }}

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
